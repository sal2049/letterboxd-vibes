[project]
name = "letterboxd-vibes"
version = "0.2.0"
description = "A map of films grouped by how people talk about them in Letterboxd reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.5",
  "hdbscan>=0.8.33",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "torch>=2.6",
  "torchvision>=0.21",        # imported by the EmbeddingGemma 2 processor
  "transformers>=5.19",
  "sentence-transformers>=6.1",
  "huggingface-hub>=0.20",
  "fasttext-wheel>=0.9.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# The model that names the groups runs through MLX, which needs Apple Silicon.
naming = ["mlx-lm>=0.30; sys_platform == 'darwin'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]
